    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Get On A Pod",
      "description": "Podcast booking service for founders, advisors, operators, and experts who want approval-first outreach and live campaign visibility.",
      "url": "https://getonapod.com",
      "logo": "https://getonapod.com/icon-512.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Sales",
        "availableLanguage": "English"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Get On A Pod",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Podcast booking software for agencies: find shows, get the client's approval, pitch, and track every booking in a client portal under your own name.",
      "offers": {
        "@type": "Offer",
        "price": "39",
        "priceCurrency": "USD",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "39",
          "priceCurrency": "USD",
          "billingDuration": "P1M"
        }
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What kind of podcasts will I be on?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We target shows based on your expertise, audience fit, topic match, and whether the format actually supports a strong guest conversation."
          }
        },
        {
          "@type": "Question",
          "name": "How fast will I get booked?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most clients see their first booking within 2 to 4 weeks, depending on positioning, approvals, and host responsiveness."
          }
        },
        {
          "@type": "Question",
          "name": "Can I approve shows before outreach starts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your portal shows the podcasts we recommend, why they fit, and where they sit in the workflow. Outreach only starts after your approval."
          }
        },
        {
          "@type": "Question",
          "name": "How much does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Plans start at $39 per month for agencies managing their own client roster, with pricing shown on the site. Request access to get started."
          }
        }
      ]
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
